apiVersion: core.oam.dev/v1alpha1
kind: Definition
metadata:
  name: trigger-action-patch-resource
  namespace: vela-system
spec:
  type: trigger-action
  templates:
    main.cue: |
      import (
        "vela/kube"
      )

      patchObject: kube.#Patch & {
        $params: {
          resource: {
            apiVersion: parameter.resource.apiVersion
            kind:       parameter.resource.kind
            metadata: {
              name:      _name
              namespace: _namespace
            }
          }
          patch: parameter.patch
        }
      }

      // The name and namespace are given directly or under metadata; directly
      // wins.
      _name: string
      if parameter.resource.name != _|_ {
        _name: parameter.resource.name
      }
      if parameter.resource.name == _|_ if parameter.resource.metadata.name != _|_ {
        _name: parameter.resource.metadata.name
      }
      _namespace: string
      if parameter.resource.namespace != _|_ {
        _namespace: parameter.resource.namespace
      }
      if parameter.resource.namespace == _|_ if parameter.resource.metadata.namespace != _|_ {
        _namespace: parameter.resource.metadata.namespace
      }
      if parameter.resource.namespace == _|_ if parameter.resource.metadata.namespace == _|_ {
        _namespace: "default"
      }

      parameter: {
        // +usage=The resource to patch
        resource: {
          // +usage=The api version of the resource
          apiVersion: string
          // +usage=The kind of the resource
          kind: string
          // +usage=The name of the resource
          name?: string
          // +usage=The namespace of the resource; default if not set
          namespace?: string
          // +usage=The name and namespace of the resource, as an alternative to name and namespace
          metadata?: {
            name?:      string
            namespace?: string
          }
        }
        // +usage=The patch to be applied to the resource with kubernetes patch
        patch: *{
          // +usage=The type of patch being provided
          type: "merge"
          data: {...}
        } | {
          // +usage=The type of patch being provided
          type: "json"
          data: [{...}]
        } | {
          // +usage=The type of patch being provided
          type: "strategic"
          data: {...}
        }
      }
