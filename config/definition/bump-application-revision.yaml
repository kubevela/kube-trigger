apiVersion: core.oam.dev/v1alpha1
kind: Definition
metadata:
  name: trigger-action-bump-application-revision
  namespace: vela-system
spec:
  type: trigger-action
  templates:
    main.cue: |
      import (
        "strconv"
        "vela/kube"
      )

      // The namespace the Applications are in: the one given, or the source
      // object's. It is settled here, as one value, before it reaches a provider.
      _namespace: string
      if parameter.namespace != _|_ {
        _namespace: parameter.namespace
      }
      if parameter.namespace == _|_ {
        _namespace: context.data.metadata.namespace
      }

      // A nameSelector with neither field would select nothing, silently. Refuse it.
      if parameter.nameSelector != _|_ if parameter.nameSelector.fromLabel == _|_ if parameter.nameSelector.matchingLabels == _|_ {
        nameSelectorNeedsFromLabelOrMatchingLabels: true & false
      }

      // The Applications to bump, as the cluster returns them.
      _apps: [...{...}]

      // Every Application carrying the given labels.
      if parameter.nameSelector != _|_ if parameter.nameSelector.matchingLabels != _|_ {
        list: kube.#List & {
          $params: {
            resource: {
              apiVersion: "core.oam.dev/v1beta1"
              kind:       "Application"
            }
            filter: {
              namespace:      _namespace
              matchingLabels: parameter.nameSelector.matchingLabels
            }
          }
        }
        _apps: list.$returns.items
      }

      // The Application named by a label on the source object.
      if parameter.nameSelector != _|_ if parameter.nameSelector.fromLabel != _|_ {
        get: kube.#Get & {
          $params: {
            resource: {
              apiVersion: "core.oam.dev/v1beta1"
              kind:       "Application"
              metadata: {
                name:      context.data.metadata.labels[parameter.nameSelector.fromLabel]
                namespace: _namespace
              }
            }
          }
        }
        _apps: [get.$returns]
      }

      // With no selector, the Application with the source object's own name.
      if parameter.nameSelector == _|_ {
        get: kube.#Get & {
          $params: {
            resource: {
              apiVersion: "core.oam.dev/v1beta1"
              kind:       "Application"
              metadata: {
                name:      context.data.metadata.name
                namespace: _namespace
              }
            }
          }
        }
        _apps: [get.$returns]
      }

      // Add one to the publishVersion of each Application that has it as a whole
      // number. KubeVela deploys an Application again when it changes.
      for index, item in _apps {
        if item.metadata.annotations["app.oam.dev/publishVersion"] != _|_ {
          if strconv.ParseInt(item.metadata.annotations["app.oam.dev/publishVersion"], 10, 64) != _|_ {
            "patch-\(index)": kube.#Patch & {
              $params: {
                resource: {
                  apiVersion: "core.oam.dev/v1beta1"
                  kind:       "Application"
                  metadata: {
                    name:      item.metadata.name
                    namespace: item.metadata.namespace
                  }
                }
                patch: {
                  type: "merge"
                  data: {
                    metadata: {
                      annotations: {
                        "app.oam.dev/publishVersion": strconv.FormatInt(strconv.ParseInt(item.metadata.annotations["app.oam.dev/publishVersion"], 10, 64)+1, 10)
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }

      parameter: {
        // +usage=The namespace of the Applications; the source object's namespace if not set
        namespace?: string
        // +usage=Which Applications to bump; the one with the source object's name if not set
        nameSelector?: close({
          // +usage=A label on the source object whose value is the Application's name
          fromLabel!: string
        }) | close({
          // +usage=Bump every Application carrying these labels
          matchingLabels!: {...}
        })
      }
