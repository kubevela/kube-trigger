name: Trivy Scan

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  USE_BUILD_CONTAINER: '1'

jobs:
  detect-noop:
    name: Detect No-op Changes
    runs-on: ubuntu-latest
    permissions:
      actions: write # for skip-duplicate-actions to skip or stop workflow runs
      contents: read # for paths_ignore to read the changed files
    outputs:
      noop: ${{ steps.noop.outputs.should_skip }}
    steps:
      - name: Detect No-op Changes
        id: noop
        uses: fkirc/skip-duplicate-actions@v5.3.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          paths_ignore: '["**.md", "**.mdx", "**.png", "**.jpg", "**.svg"]'
          do_not_skip: '["workflow_dispatch", "schedule", "push"]'
        continue-on-error: true

  images:
    name: Image Scan
    runs-on: ubuntu-latest
    needs: detect-noop
    if: needs.detect-noop.outputs.noop != 'true'
    permissions:
      contents: read
      security-events: write # to upload results; not granted to PRs from forks
    strategy:
      fail-fast: false
      matrix:
        include:
          - subproject: trigger
            image: kube-trigger
          - subproject: manager
            image: kube-trigger-manager
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Image
        run: make ${{ matrix.subproject }}-container IMAGE_TAG=scan

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: docker.io/oamdev/${{ matrix.image }}:scan
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        with:
          sarif_file: trivy-results.sarif
          category: trivy-${{ matrix.image }}
