name: Unit Tests

on:
  push:
    branches:
      - main
      - release-*
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - release-*
  workflow_dispatch: { }

env:
  GO_VERSION: '1.25.12'

jobs:
  detect-noop:
    name: Detect No-op Changes
    runs-on: ubuntu-latest
    outputs:
      noop: ${{ steps.noop.outputs.should_skip }}
    steps:
      - name: Detect No-op Changes
        id: noop
        uses: fkirc/skip-duplicate-actions@v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          paths_ignore: '["**.md", "**.mdx", "**.png", "**.jpg", "**.svg"]'
          do_not_skip: '["workflow_dispatch", "schedule", "push"]'
          concurrent_skipping: false

  unit-test:
    name: Run Unit Tests and Integration Tests
    runs-on: ubuntu-latest
    needs: detect-noop
    if: needs.detect-noop.outputs.noop != 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Cache envtest binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/kubebuilder-envtest
          key: ${{ runner.os }}-kubebuilder-envtest-${{ hashFiles('Makefile') }}
          restore-keys: |
            ${{ runner.os }}-kubebuilder-envtest-

      - name: Install ginkgo
        run: |
          go install -mod=mod github.com/onsi/ginkgo/v2/ginkgo

      - name: Prepare minikube
        # For whatever reason, certain unit tests relies on k8s.
        # Although such reliance should be removed, in the meantime,
        # we set up a local k8s cluster to run such tests.
        # Use minikube simply because it comes with GitHub runner.
        run: minikube start

      - name: Run tests
        run: make test

      - name: Save coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: cover.out
          # A re-run of the workflow uploads it again under the same name.
          overwrite: true
          if-no-files-found: error

  upload-coverage:
    name: Upload Coverage
    runs-on: ubuntu-latest
    needs: unit-test
    # The upload runs apart from the tests so the OIDC token it needs is never
    # available to repository code. Fork PRs get no OIDC token and upload without
    # one.
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Fetch coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage

      - name: Upload coverage report
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: ./cover.out
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: true
          verbose: true
