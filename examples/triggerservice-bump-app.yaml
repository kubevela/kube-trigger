# Redeploy a KubeVela Application when a ConfigMap it uses changes. Needs KubeVela.
# See README.md in this directory.
apiVersion: standard.oam.dev/v1alpha1
kind: TriggerService
metadata:
  name: kubetrigger-sample-config
  namespace: default
spec:
  triggers:
    - source:
        type: resource-watcher
        properties:
          # We are interested in ConfigMap events.
          apiVersion: "v1"
          kind: ConfigMap
          namespace: default
          # Only watch update event.
          events:
            - update
      # Keep the ConfigMaps whose names start with this-will-trigger-update-.
      filter: context.data.metadata.name =~ "^this-will-trigger-update-"
      action:
        # Bump Application Revision to update Application.
        type: bump-application-revision
        properties:
          namespace: default
          # The Application to bump is named by this label on the ConfigMap.
          nameSelector:
            fromLabel: "watch-this"
