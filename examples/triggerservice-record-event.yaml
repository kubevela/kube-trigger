# Record the events of the Deployments that belong to a WorkflowRun, for the
# workflow controller to read. Needs the WorkflowRun CRD from kubevela/workflow.
# See README.md in this directory.
apiVersion: standard.oam.dev/v1alpha1
kind: TriggerService
metadata:
  name: record-event
  namespace: default
spec:
  triggers:
    # When a WorkflowRun labelled trigger.oam.dev/watch=true is created, create an
    # EventListener with its name.
    - source:
        type: resource-watcher
        properties:
          apiVersion: core.oam.dev/v1alpha1
          kind: WorkflowRun
          events:
            - create
          matchingLabels:
            trigger.oam.dev/watch: "true"
      action:
        type: create-event-listener
    # When a Deployment becomes fully ready, append the event to the EventListener
    # named by the Deployment's workflowrun.oam.dev/name label.
    - source:
        type: resource-watcher
        properties:
          apiVersion: apps/v1
          kind: Deployment
          events:
            - update
          matchingLabels:
            trigger.oam.dev/watch: "true"
      filter: context.data.status.readyReplicas == context.data.status.replicas
      action:
        type: record-event
        properties:
          nameSelector:
            fromLabel: "workflowrun.oam.dev/name"
